<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2a37; --muted:#5b6675; --line:#e3ded3;
  --brand:#2f5d8a; --brand-2:#e2ecf6; --accent:#e07a3f; --accent-2:#fbe9dd;
  --good:#2e8b57; --good-2:#e3f3ea; --bad:#c0392b; --bad-2:#fbe7e4; --warn:#b7791f; --warn-2:#fdf3dc;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 60px}
header{background:var(--brand);color:#fff}
header .wrap{display:flex;align-items:center;gap:16px;padding-top:16px;padding-bottom:0;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.logo svg{flex:none}
.hstats{margin-left:auto;font-size:.9rem;opacity:.9}
nav{display:flex;gap:4px;width:100%;margin-top:12px}
nav button{background:transparent;border:0;color:#d6e3f0;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:500}
nav button.on{background:var(--bg);color:var(--ink)}
h1{font-size:1.6rem;margin:28px 0 6px}
h2{font-size:1.2rem;margin:28px 0 10px}
h3{font-size:1.05rem;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin:14px 0}
.hero{border:2px solid var(--brand);}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--brand-2);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.orange{background:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--brand-2);color:var(--brand)}
.tag.good{background:var(--good-2);color:var(--good)}
.tag.warn{background:var(--warn-2);color:var(--warn)}
.tag.new{background:#eee;color:#666}
.tag.bad{background:var(--bad-2);color:var(--bad)}
.path{list-style:none;padding:0;margin:0}
.path li{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
.path li:last-child{border-bottom:0}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;background:#eee;color:#777}
.dot.done{background:var(--good);color:#fff}
.dot.next{background:var(--accent);color:#fff}
.path .t{flex:1}
.path .t small{display:block;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-size:1.6rem}
.stat span{color:var(--muted);font-size:.85rem}
.learn ul{padding-left:20px;margin:8px 0}
.learn li{margin:6px 0}
.example{background:var(--accent-2);border-radius:10px;padding:12px 16px;margin:12px 0}
.mono{font-variant-numeric:tabular-nums}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.9rem}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.prompt{font-size:1.15rem;margin:8px 0 14px}
.diagram{margin:6px 0 14px;overflow-x:auto}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-2)}
.opt.right{border-color:var(--good);background:var(--good-2)}
.opt.wrong{border-color:var(--bad);background:var(--bad-2)}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans input{font:inherit;font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;width:170px}
.ans input:focus{outline:none;border-color:var(--brand)}
.ans .pt input{width:90px}
.chips{display:flex;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-size:1rem}
.fb{border-radius:12px;padding:12px 16px;margin-top:14px}
.fb.good{background:var(--good-2);border-left:5px solid var(--good)}
.fb.bad{background:var(--bad-2);border-left:5px solid var(--bad)}
.fb.hint{background:var(--warn-2);border-left:5px solid var(--warn)}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:3px 0}
table.tw{border-collapse:collapse;margin:6px 0 14px}
table.tw td,table.tw th{border:1px solid var(--line);padding:6px 14px;text-align:center}
table.tw th{background:var(--brand-2)}
.skill{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0}
.skill .nm{flex:1}
.skill .nm small{display:block;color:var(--muted)}
.minibar{width:90px}
textarea{width:100%;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:150px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.vids{margin-top:8px;font-size:.92rem}
.kbd{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><polygon points="15,3 27,26 3,26" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="18" r="4" fill="#e07a3f"/></svg>
      Geometry Coach
    </div>
    <div class="hstats" id="hstats"></div>
    <nav>
      <button data-tab="today" class="on">Today</button>
      <button data-tab="practice">Practice by skill</button>
      <button data-tab="progress">Progress</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtN(v){ if(Math.abs(v-Math.round(v))<1e-9){const r=Math.round(v);return (r<0?'−':'')+Math.abs(r);} const s=(+v.toFixed(2)).toString(); return s.replace('-','−'); }
function frac(n,d){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); n/=g; d/=g; return d===1?fmtN(n):(n<0?'−':'')+Math.abs(n)+'/'+d; }
const P=(x,y)=>'('+fmtN(x)+', '+fmtN(y)+')';
function lin(p,q,v='x'){ let a=(p===1?'':p===-1?'−':p)+v; if(q>0)a+=' + '+q; else if(q<0)a+=' − '+(-q); return a; }
const sq=v=>v<0?'('+fmtN(v)+')':fmtN(v);
function todayStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function niceDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function parseNum(raw){
  let s=String(raw).trim().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'');
  if(!s) return NaN;
  let pct=false; if(s.endsWith('%')){pct=true;s=s.slice(0,-1);}
  let v,m;
  if((m=s.match(/^(-?\d*\.?\d*)(?:√|sqrt)\(?(\d*\.?\d+)\)?$/i))){const c=m[1]===''?1:m[1]==='-'?-1:parseFloat(m[1]);v=c*Math.sqrt(parseFloat(m[2]));}
  else if((m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/))){v=parseFloat(m[1])/parseFloat(m[2]);}
  else if(/^-?\d*\.?\d+$/.test(s)) v=parseFloat(s);
  else v=NaN;
  if(pct) v/=100;
  return v;
}

/* ---------- diagrams ---------- */
function segDiagram(L,a,b,txt){
  const W=460,x0=30,x1=x0+(W-60)*a/(a+b),x2=W-30;
  return `<svg viewBox="0 0 ${W} 100" width="${W}" style="max-width:100%">
  <line x1="10" y1="45" x2="${W-10}" y2="45" stroke="#1f2a37" stroke-width="2"/>
  ${[x0,x1,x2].map((x,i)=>`<circle cx="${x}" cy="45" r="5" fill="#2f5d8a"/><text x="${x}" y="72" text-anchor="middle" font-weight="600" font-size="16">${L[i]}</text>`).join('')}
  <text x="${(x0+x1)/2}" y="35" text-anchor="middle" fill="#e07a3f" font-size="15" font-weight="600">${txt[0]}</text>
  <text x="${(x1+x2)/2}" y="35" text-anchor="middle" fill="#e07a3f" font-size="15" font-weight="600">${txt[1]}</text>
  ${txt[2]?`<path d="M${x0} 84 L${x0} 90 L${x2} 90 L${x2} 84" fill="none" stroke="#5b6675"/><text x="${(x0+x2)/2}" y="99" text-anchor="middle" fill="#5b6675" font-size="13">${L[0]}${L[2]} = ${txt[2]}</text>`:''}
  </svg>`;
}
function numLine(min,max,marks){
  const W=520,pad=24,sx=v=>pad+(v-min)*(W-2*pad)/(max-min);
  let ticks='';const step=(max-min)>30?5:(max-min)>16?2:1;
  for(let v=Math.ceil(min/step)*step;v<=max;v+=step){ticks+=`<line x1="${sx(v)}" y1="40" x2="${sx(v)}" y2="50" stroke="#1f2a37"/><text x="${sx(v)}" y="68" text-anchor="middle" font-size="12" fill="#5b6675">${fmtN(v)}</text>`;}
  const m=marks.map(k=>`<circle cx="${sx(k.v)}" cy="45" r="6" fill="#e07a3f"/><text x="${sx(k.v)}" y="28" text-anchor="middle" font-weight="700" font-size="15">${k.label}</text>`).join('');
  return `<svg viewBox="0 0 ${W} 80" width="${W}" style="max-width:100%"><line x1="8" y1="45" x2="${W-8}" y2="45" stroke="#1f2a37" stroke-width="2"/><polygon points="${W-8},45 ${W-16},40 ${W-16},50" fill="#1f2a37"/><polygon points="8,45 16,40 16,50" fill="#1f2a37"/>${ticks}${m}</svg>`;
}
const lineFig=`<svg viewBox="0 0 420 90" width="420" style="max-width:100%"><line x1="10" y1="50" x2="410" y2="50" stroke="#1f2a37" stroke-width="2"/><polygon points="410,50 400,45 400,55"/><polygon points="10,50 20,45 20,55"/>${[[90,'A'],[210,'B'],[330,'C']].map(([x,l])=>`<circle cx="${x}" cy="50" r="5" fill="#2f5d8a"/><text x="${x}" y="80" text-anchor="middle" font-weight="600">${l}</text>`).join('')}<text x="395" y="35" font-style="italic" font-weight="600">ℓ</text><circle cx="250" cy="18" r="5" fill="#e07a3f"/><text x="262" y="22" font-weight="600">D</text></svg>`;

/* ---------- MC banks ---------- */
const BANK={
s11a:[
 {q:'Which of these is an <b>undefined term</b> in geometry?',o:[['Point',1,'Right! Point, line, and plane are the three undefined terms.'],['Segment',0,'A segment is <i>defined</i> using points and a line (two endpoints and all points between them).'],['Ray',0,'A ray is defined using points and a line, so it’s a defined term.'],['Angle',0,'An angle is defined as two rays with a common endpoint, so it’s a defined term.']]},
 {q:'Why are point, line, and plane called “undefined”?',o:[['Any definition would need other words, so we have to start somewhere: they’re described, not defined.',1,'Exactly. Every system needs a starting place.'],['Mathematicians haven’t agreed on what they mean.',0,'They agree on what they mean. The point is that defining them would require even more basic words.'],['They are never used in proofs.',0,'They’re used constantly. They’re the building blocks for everything else.'],['They can’t be drawn.',0,'We draw them all the time (dots, arrows, flat shapes). We just don’t give them formal definitions.']]},
 {q:'A <b>line segment</b> is…',o:[['part of a line made of two endpoints and all the points between them',1,'Yes!'],['a line that goes on forever in both directions',0,'That describes a line, not a segment.'],['part of a line with one endpoint that goes on forever in one direction',0,'That’s a ray.'],['a flat surface with no thickness',0,'That’s a plane.']]},
 {q:'A <b>plane</b>…',o:[['extends forever in all directions and has no thickness',1,'Correct.'],['is a rectangle with four edges',0,'We often <i>draw</i> it as a parallelogram, but a plane has no edges. It goes on forever.'],['has a thickness of one unit',0,'A plane has no thickness at all.'],['is made of exactly three points',0,'Three noncollinear points <i>determine</i> a plane, but the plane holds infinitely many points.']]},
 {q:'In what order is an axiomatic system built?',o:[['Undefined terms → definitions → postulates → theorems',1,'Yes. Each level is built from the ones before it.'],['Theorems → postulates → definitions → undefined terms',0,'That’s backwards. Theorems come last because they’re proven from everything else.'],['Postulates → undefined terms → theorems → definitions',0,'You need the undefined terms before you can state postulates about them.'],['Definitions → theorems → undefined terms → postulates',0,'Definitions are built from undefined terms, so undefined terms must come first.']]},
 {q:'A <b>ray</b> has…',o:[['one endpoint and extends forever in one direction',1,'Right.'],['two endpoints',0,'That’s a segment.'],['no endpoints',0,'That’s a line.'],['one endpoint and extends in both directions',0,'If it went both ways from a point, it would be two rays (opposite rays), not one ray.']]}
],
s11b:[
 {q:'A <b>postulate</b> (axiom) is a statement that…',o:[['is accepted as true without proof',1,'Correct.'],['has been proven using other statements',0,'That’s a theorem.'],['is a guess based on examples',0,'That’s a conjecture.'],['defines a new word',0,'That’s a definition.']]},
 {q:'A <b>theorem</b> is a statement that…',o:[['has been proven using definitions, postulates, and other theorems',1,'Yes!'],['is accepted without proof',0,'That’s a postulate (axiom).'],['is true because it works for several examples',0,'Examples can suggest something is true, but only a proof makes it a theorem.'],['can never be used in another proof',0,'Theorems are used to prove other theorems all the time.']]},
 {q:'“Through any two points there is exactly one line.” This statement is a…',o:[['postulate',1,'Right. It’s one of the basic rules we accept without proof.'],['theorem',0,'It isn’t proven from anything; it’s one of the starting rules. That makes it a postulate.'],['definition',0,'It doesn’t define a word. It states a rule about points and lines.'],['conjecture',0,'It’s not a guess. It’s an accepted rule (postulate).']]},
 {q:'Maya drew 5 triangles and noticed each time that the angles added to 180°. Her statement is best called a…',o:[['conjecture',1,'Yes. Checking examples suggests it’s true, but it isn’t proven yet.'],['theorem',0,'It IS a true theorem, but Maya hasn’t proven it. Checking 5 examples isn’t a proof, so for her it’s still a conjecture.'],['postulate',0,'Postulates are accepted starting rules, not patterns noticed from examples.'],['undefined term',0,'Undefined terms are point, line, and plane.']]},
 {q:'In a <b>consistent</b> axiomatic system…',o:[['no two statements contradict each other',1,'Correct.'],['every statement is a postulate',0,'Consistent means no contradictions, not that everything is a postulate.'],['there are no undefined terms',0,'Every axiomatic system starts with undefined terms.'],['theorems are accepted without proof',0,'Theorems always need proof.']]},
 {q:'Which is the best way to show a conjecture is <b>false</b>?',o:[['Find one counterexample',1,'Yes. One example where it fails is enough to show it’s false.'],['Find three examples where it works',0,'Examples where it works can’t prove it false (or prove it true).'],['Call it a postulate',0,'Renaming it doesn’t change whether it’s true.'],['Draw it very carefully',0,'A careful drawing can suggest things, but a single counterexample is what disproves a conjecture.']]}
],
s12a:[
 {q:'Which is <b>NOT</b> a correct name for the line shown?',fig:lineFig,o:[['line A',1,'Right. A single point can’t name a line; you need two points on it, or the lowercase letter.'],['line AC',0,'That one works: A and C are both on the line. Look for a name that doesn’t work.'],['line ℓ',0,'That one works: lowercase script letters can name lines.'],['line BA',0,'That one works: order doesn’t matter for naming a line.']]},
 {q:'Using the figure, which point is <b>not</b> collinear with A and B?',fig:lineFig,o:[['D',1,'Correct. D is off line ℓ.'],['C',0,'C is on line ℓ with A and B, so it IS collinear with them.'],['A',0,'A is one of the points we’re comparing to.'],['B',0,'B is one of the points we’re comparing to.']]},
 {q:'A plane can be named by…',o:[['three noncollinear points in it, or a capital script letter',1,'Yes!'],['any two points in it',0,'Two points name a line, and infinitely many planes contain any one line.'],['three collinear points in it',0,'Three points in a row lie in infinitely many planes, so they can’t name just one.'],['a lowercase letter',0,'Lowercase letters usually name lines.']]},
 {q:'Ray AB starts at…',o:[['point A and passes through B',1,'Right. The first letter is always the endpoint.'],['point B and passes through A',0,'That’s ray BA. The first letter is the endpoint.'],['the midpoint of A and B',0,'Rays start at an endpoint, the first letter in the name.'],['neither point; it has no endpoint',0,'That would be a line. A ray has one endpoint.']]},
 {q:'Are ray AB and ray BA the same ray?',o:[['No. They have different endpoints and point in opposite directions.',1,'Exactly.'],['Yes. They contain the same two points.',0,'They share points A and B, but ray AB starts at A and goes past B, while ray BA starts at B and goes past A.'],['Only if AB is short',0,'Length doesn’t matter. The endpoint and direction make them different.'],['Yes. Order never matters in names.',0,'Order doesn’t matter for lines and segments, but it DOES matter for rays.']]},
 {q:'Segment AB and segment BA are…',o:[['the same segment',1,'Yes. A segment is just the two endpoints and everything between, so order doesn’t matter.'],['different segments',0,'Both have endpoints A and B and the same points between, so they’re identical.'],['opposite rays',0,'Segments and rays are different things.'],['only the same if they’re horizontal',0,'Direction on the page doesn’t matter.']]}
],
s12b:[
 {q:'Points that lie on the same line are called…',o:[['collinear',1,'Correct.'],['coplanar',0,'Coplanar means in the same <i>plane</i>. Same <i>line</i> is collinear.'],['congruent',0,'Congruent means same size and shape.'],['concurrent',0,'Concurrent describes lines meeting at a single point.']]},
 {q:'Any three points are <b>always</b>…',o:[['coplanar',1,'Yes. Any three points lie in at least one plane.'],['collinear',0,'Not always. Three points could form a triangle.'],['noncoplanar',0,'You can always fit a plane through any three points.'],['the vertices of a triangle',0,'Not if they happen to be in a straight line.']]},
 {q:'Two different planes that intersect meet in a…',o:[['line',1,'Right. Think of two walls meeting at a corner line.'],['point',0,'Planes are infinite and flat, so if they meet, they meet along a whole line.'],['plane',0,'Then they’d be the same plane.'],['segment',0,'Planes go on forever, so their intersection does too: a line, not a segment.']]},
 {q:'Two different lines can intersect in at most…',o:[['one point',1,'Correct.'],['two points',0,'If two lines shared two points, they’d be the same line (only one line goes through two points).'],['a line',0,'Then they’d be the same line.'],['infinitely many points',0,'Only if they’re the same line.']]},
 {q:'How many planes contain three <b>noncollinear</b> points?',o:[['exactly one',1,'Yes. That’s a postulate.'],['none',0,'There’s always a plane through them.'],['two',0,'Three noncollinear points pin down exactly one plane, like a 3-legged stool.'],['infinitely many',0,'That happens with collinear points. Noncollinear points determine exactly one plane.']]},
 {q:'Three different planes can intersect in…',o:[['a point, a line, or not at all, depending on how they’re arranged',1,'Right. Picture a room corner (a point), pages of a book (a line), or three parallel floors (no intersection).'],['always exactly one point',0,'That’s one possibility (a corner), but not the only one.'],['always a line',0,'That happens with pages of a book, but planes can also meet at a point or not at all.'],['always a plane',0,'Different planes can’t share a whole plane.']]},
 {q:'Are any <b>four</b> points always coplanar?',o:[['No. The fourth point could be above or below the plane of the other three.',1,'Correct. Think of the corners of a pyramid with a triangle base.'],['Yes, always',0,'Three points always fit in a plane, but a fourth can stick out of it.'],['Only if they form a square',0,'A square is one coplanar case, but the real answer is “not always.”'],['Yes, if they are collinear',0,'Collinear points ARE coplanar, but the question asks about ANY four points.']]}
]};
function mcGen(id){
  return ()=>{
    const bank=BANK[id]; const recent=(state.recent[id]||[]);
    let idx; let tries=0; do{idx=ri(0,bank.length-1);tries++;}while(recent.includes(idx)&&tries<20);
    state.recent[id]=[idx,...recent].slice(0,Math.min(3,bank.length-1));
    const it=bank[idx];
    return {kind:'mc',prompt:it.q,svg:it.fig||'',options:shuffle(it.o.map(([t,ok,fb])=>({t,ok:!!ok,fb}))),hint:'Read every choice. Rule out the ones you know are wrong first.'};
  };
}

/* ---------- generators ---------- */
const LETTERS=[['A','B','C'],['P','Q','R'],['J','K','L'],['R','S','T']];
function g13a(){
  const [X,Y,Z]=pick(LETTERS); const a=ri(2,14)+(Math.random()<.3?.5:0), b=ri(2,14);
  if(Math.random()<.5) return {kind:'num',ans:a+b,tol:.01,
    prompt:`${Y} is between ${X} and ${Z}. ${X}${Y} = ${fmtN(a)} and ${Y}${Z} = ${fmtN(b)}. Find ${X}${Z}.`,

function status(id){const s=state.skills[id];if(!s||!s.att)return 'new';if(s.streak>=4&&s.days.length>=2)return 'mastered';if(s.streak>=2)return 'close';return 'practicing';}

function record(id,clean,correct,trapK){
  const s=sk(id),t=todayStr();s.att++;if(correct)s.correct++;
  if(clean){s.clean++;s.streak++;if(!s.days.includes(t))s.days.push(t);}else s.streak=0;
  if(trapK)s.traps[trapK]=(s.traps[trapK]||0)+1;

/* ---------- runs ---------- */
function buildQueue(skills,n){const q=[];const pool=shuffle(skills);for(let i=0;i<n;i++)q.push(pool[i%pool.length]);return shuffle(q);}
function startSession(id){const s=SESSIONS.find(x=>x.id===id);run={mode:'session',sess:s,test:!!s.test,queue:buildQueue(s.skills,s.n),i:0,results:[],phase:s.learn?'learn':'q'};newQ();render();window.scrollTo(0,0);}
function startSkill(k){run={mode:'skill',skill:k,queue:buildQueue([k],5),i:0,results:[],phase:'q'};newQ();render();window.scrollTo(0,0);}
function startSmart(){const w=weakSkills();if(!w.length)return;run={mode:'smart',queue:buildQueue(w,6),i:0,results:[],phase:'q'};newQ();render();window.scrollTo(0,0);}
function newQ(){if(!run.queue||run.i>=run.queue.length)return;const k=run.queue[run.i];run.q=Object.assign({skill:k},SKILLS[k].gen());run.tries=0;run.hint=false;run.done=false;run.fb='';run.sel=null;run.trapK=null;}
function quit(){run=null;render();}

function learnCard(L,withStart){

  ${withStart?`<button class="btn orange" onclick="run.phase='q';render();window.scrollTo(0,0)">I’m ready, start practice →</button>`:`<button class="btn alt" onclick="quit()">Back</button>`}</div>`;
}

function renderRun(){
  if(run.mode==='learnOnly'){main.innerHTML=`<p><button class="btn ghost" onclick="quit()">← Back</button></p>`+learnCard(run.learn,false);return;}
  const title=run.mode==='session'?run.sess.title:run.mode==='skill'?SKILLS[run.skill].name:'Smart Review';
  let h=`<div class="row" style="margin-top:20px"><button class="btn ghost" onclick="quit()">← Exit</button><b style="flex:1">${esc(title)}</b></div>`;
  if(run.phase==='learn'){const Ls=[].concat(run.sess.learn);main.innerHTML=h+(Ls.length>1?`<p class="muted">Skim these ${Ls.length} quick reviews (about 5 minutes), then practice.</p>`:'')+`<div class="fb hint" style="margin-top:0">✏️ Get paper and a pencil. Work every problem on paper, then type your answer. At the end you can copy your results for your teacher.</div>`+Ls.map(L=>learnCard(L,false).replace(/<button class="btn alt" onclick="quit\(\)">Back<\/button>/,'')).join('')+`<button class="btn orange" onclick="run.phase='q';render();window.scrollTo(0,0)">I’m ready, start practice →</button>`;return;}
  if(run.phase==='summary'){main.innerHTML=h+summaryHTML();return;}
  const q=run.q,n=run.queue.length;
  h+=`<div class="card"><div class="qhead"><span>Question ${run.i+1} of ${n}</span><span class="tag">${esc(SKILLS[q.skill].name)}</span></div>
  <div class="bar"><i style="width:${100*run.i/n}%"></i></div>
  <div class="prompt">${q.prompt}</div>${q.svg?`<div class="diagram">${q.svg}</div>`:''}`;
  if(q.kind==='mc'){
    h+=`<div class="opts">`+q.options.map((o,i)=>{let c='opt';if(run.done&&o.ok)c+=' right';else if(run.wrongPicks&&run.wrongPicks.includes(i))c+=' wrong';else if(run.sel===i)c+=' sel';
      return `<button class="${c}" ${run.done||(run.wrongPicks&&run.wrongPicks.includes(i))?'disabled':''} onclick="run.sel=${i};render()">${o.t}</button>`;}).join('')+`</div>`;
  } else if(q.kind==='num'){
    h+=`<div class="ans"><input id="a1" autocomplete="off" placeholder="Your answer" ${run.done?'disabled':''} value="${esc(run.v1||'')}"></div>
    <div class="chips">${['−','/','√'].map(c=>`<button class="chip" onclick="ins('${c}')">${c}</button>`).join('')}<span class="kbd" style="align-self:center;margin-left:6px">Fractions like 3/4 are fine</span></div>`;
  } else if(q.kind==='multi'){
    h+=q.fields.map((f,i)=>`<div class="ans" style="margin:8px 0"><label style="flex:1;min-width:220px">${f.label}</label><input id="f${i}" autocomplete="off" ${run.done?'disabled':''} value="${esc((run.fv||[])[i]||'')}" style="width:120px">${run.fstat&&run.fstat[i]!=null?(run.fstat[i]?' ✅':' ❌'):''}</div>`).join('')+`<div class="chips">${['−','√'].map(c=>`<button class="chip" onclick="ins('${c}')">${c}</button>`).join('')}</div>`;
  } else {
    h+=`<div class="ans pt">( <input id="a1" autocomplete="off" placeholder="x" ${run.done?'disabled':''} value="${esc(run.v1||'')}"> , <input id="a2" autocomplete="off" placeholder="y" ${run.done?'disabled':''} value="${esc(run.v2||'')}"> )</div>
    <div class="chips">${['−','/'].map(c=>`<button class="chip" onclick="ins('${c}')">${c}</button>`).join('')}</div>`;
  }
  h+=run.fb;
  h+=`<div class="row" style="margin-top:16px">`;
  if(run.test&&!run.done){h+=`<button class="btn" onclick="check()">Submit answer →</button><span class="small muted">No hints. Work it out on paper, then type your answer. You’ll see every solution at the end.</span>`;}
  else if(!run.done){h+=`<button class="btn" onclick="check()">Check</button>`; if(!run.hint) h+=`<button class="btn ghost" onclick="showHint()">💡 Hint</button>`;}
  else h+=`<button class="btn orange" id="nextBtn" onclick="nextQ()">${run.i+1<n?'Next question →':'See results →'}</button>`;
  h+=`</div></div>`;
  main.innerHTML=h;
  const a1=document.getElementById('a1');
  if(a1&&!run.done){a1.focus();}
  document.querySelectorAll('.ans input').forEach(inp=>{inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});inp.addEventListener('focus',()=>lastFocus=inp);});
  const nb=document.getElementById('nextBtn');if(nb)nb.focus();
}
let lastFocus=null;
function ins(c){const inp=lastFocus||document.getElementById('a1');if(!inp)return;const s=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,s)+c+inp.value.slice(inp.selectionEnd??s);inp.focus();inp.setSelectionRange(s+1,s+1);}
function showHint(){run.hint=true;keepInputs();run.fb+=`<div class="fb hint">💡 ${run.q.hint}${videoLinks(run.q.skill)}</div>`;render();}
function keepInputs(){const a=document.getElementById('a1'),b=document.getElementById('a2');if(a)run.v1=a.value;if(b)run.v2=b.value;if(run.q&&run.q.kind==='multi')run.fv=run.q.fields.map((f,i)=>{const e=document.getElementById('f'+i);return e?e.value:'';});}
function near(a,b,t){return Math.abs(a-b)<=t;}
function check(){
  const q=run.q; keepInputs(); let ok=false,trap=null;
  if(q.kind==='mc'){
    if(run.sel==null){toast('Pick an answer first');return;}
    run.lastPick=run.sel;
    const o=q.options[run.sel];ok=o.ok;if(!ok){trap={k:'mc',msg:o.fb};run.wrongPicks=[...(run.wrongPicks||[]),run.sel];run.sel=null;}
    else trap={msg:o.fb};
  } else if(q.kind==='num'){
    const v=parseNum(run.v1);if(isNaN(v)){toast('Type a number (like 12, −3.5, 3/4, or √20)');return;}
    ok=near(v,q.ans,q.tol);if(!ok)trap=(q.traps||[]).find(t=>near(v,t.v,q.trapTol??Math.max(q.tol,.011)))||null;
  } else if(q.kind==='multi'){
    const vals=run.fv.map(parseNum);if(vals.some(isNaN)){toast('Fill in every box');return;}
    run.fstat=q.fields.map((f,i)=>near(f.abs?Math.abs(vals[i]):vals[i],f.ans,f.tol));ok=run.fstat.every(Boolean);
    if(!ok){const i=run.fstat.indexOf(false),f=q.fields[i];const t=(f.traps||[]).find(t=>near(vals[i],t.v,.011));
      trap={k:t?(i===2&&t.v===q.fields[0].ans+q.fields[1].ans?'added Δx + Δy (no squaring)':'forgot the square root'):null,msg:`Step ${i+1}: ${t?t.msg:f.miss}`};}
  } else {
    const x=parseNum(run.v1),y=parseNum(run.v2);if(isNaN(x)||isNaN(y)){toast('Fill in both x and y');return;}
    ok=near(x,q.ans[0],q.tol)&&near(y,q.ans[1],q.tol);
    if(!ok){trap=(q.traps||[]).find(t=>near(x,t.v[0],.011)&&near(y,t.v[1],.011))||null;
      if(!trap&&near(x,q.ans[1],q.tol)&&near(y,q.ans[0],q.tol))trap={k:'swapped x and y',msg:'Your numbers are right but in the wrong order. Write (x, y).'};
      else if(!trap&&(near(x,q.ans[0],q.tol)||near(y,q.ans[1],q.tol)))trap={k:null,msg:`One coordinate is right (${near(x,q.ans[0],q.tol)?'x':'y'}). Recheck the other one.`};}
  }
  run.tries++;
  const givenNow=q.kind==='multi'?run.fv.map(esc).join(', '):q.kind==='mc'?q.options[run.lastPick].t:q.kind==='num'?esc(run.v1):`(${esc(run.v1)}, ${esc(run.v2)})`;
  if(run.test){
    const given=q.kind==='mc'?q.options[run.lastPick].t:q.kind==='num'?esc(run.v1):`(${esc(run.v1)}, ${esc(run.v2)})`;
    const tk=trap&&trap.k&&trap.k!=='mc'?trap.k:null;
    run.results.push({skill:q.skill,clean:ok,correct:ok,trapK:tk,q,given,trapMsg:trap&&!ok?trap.msg:''});record(q.skill,ok,ok,tk);
    nextQ();return;
  }
  if(ok){
    const clean=run.tries===1&&!run.hint;
    run.results.push({skill:q.skill,clean,correct:true,q,given:givenNow,tries:run.tries,hint:run.hint});record(q.skill,clean,true,run.trapK);
    run.done=true;
    run.fb+=`<div class="fb good"><b>${clean?pick(['Correct! ✅','Nailed it! ✅','Yes! ✅']):'Got it ✅'}</b>${q.kind==='mc'&&trap?' '+trap.msg:''}${q.steps?stepsHTML(q):''}</div>`;
  } else if(run.tries===1){
    if(trap&&trap.k&&trap.k!=='mc')run.trapK=trap.k;
    run.fb+=`<div class="fb bad"><b>Not quite.</b> ${trap?trap.msg:'Check your work. Tap Hint if you’re stuck.'} <b>Try again.</b>${videoLinks(q.skill)}</div>`;
  } else {
    if(!run.trapK&&trap&&trap.k&&trap.k!=='mc')run.trapK=trap.k;
    run.results.push({skill:q.skill,clean:false,correct:false,trapK:run.trapK,q,given:givenNow,trapMsg:trap?trap.msg:''});record(q.skill,false,false,run.trapK);
    run.done=true;
    const ansStr=q.kind==='multi'?q.fields.map(f=>f.tol>.04?'≈ '+f.ans.toFixed(1):fmtN(f.ans)).join(', '):q.kind==='mc'?q.options.find(o=>o.ok).t:q.kind==='num'?fmtAns(q):P(...q.ans);
    run.fb+=`<div class="fb bad"><b>Not this time.</b> ${trap?trap.msg+' ':''}The answer is <b>${ansStr}</b>.${q.steps?stepsHTML(q):''}${videoLinks(q.skill)}<div class="small muted" style="margin-top:6px">This skill will come back in your Smart Review.</div></div>`;
  }
  render();
}
function fmtAns(q){const a=q.ans;if(q.tol>.04)return '≈ '+a.toFixed(1);if(Math.abs(a-Math.round(a))<1e-9)return fmtN(a);for(let d=2;d<=200;d++){const n=Math.round(a*d);if(Math.abs(n/d-a)<1e-9)return frac(n,d)+(q.tol<.01?` (≈ ${(+a.toFixed(3))})`:'');}return fmtN(a);}
function stepsHTML(q){return `<div style="margin-top:8px"><b>How it works:</b><ol class="steps">${q.steps.map(s=>`<li class="mono">${s}</li>`).join('')}</ol></div>`;}
function nextQ(){run.i++;run.wrongPicks=null;run.v1='';run.v2='';run.fv=null;run.fstat=null;if(run.i>=run.queue.length){finish();}else newQ();render();window.scrollTo(0,0);}
function finish(){
  run.phase='summary';
  const r=run.results,clean=r.filter(x=>x.clean).length,pct=Math.round(100*clean/r.length);
  const entry={date:todayStr(),kind:run.mode,title:run.mode==='session'?run.sess.title:run.mode==='skill'?SKILLS[run.skill].name:'Smart Review',clean,total:r.length,pct,missed:[...new Set(r.filter(x=>!x.clean).map(x=>x.skill))],traps:r.filter(x=>x.trapK).map(x=>x.trapK)};
  state.log.unshift(entry);state.log=state.log.slice(0,200);
  if(run.mode==='session'){const prev=state.sessions[run.sess.id];state.sessions[run.sess.id]={date:todayStr(),best:Math.max(pct,prev?prev.best:0)};}
  save();run.entry=entry;
}
function summaryHTML(){
  const e=run.entry;const by={};run.results.forEach(x=>{by[x.skill]=by[x.skill]||{c:0,t:0};by[x.skill].t++;if(x.clean)by[x.skill].c++;});
  const msg=e.pct>=85?['🌟 Excellent work!','You’re ready to move on. Come back tomorrow for the next session.']:e.pct>=60?['👍 Solid effort!','A few things to tighten up. Your Smart Review will bring back the skills you missed.']:['💪 Good practice, keep going.','This one’s worth another try. Reread the example in the lesson review, then redo this session tomorrow.'];
  let h=`<div class="card hero"><h2 style="margin:0 0 4px">${msg[0]}</h2><p style="font-size:1.4rem;margin:6px 0"><b>${e.clean} / ${e.total}</b> correct on the first try (${e.pct}%)</p><p class="muted" style="margin:0">${msg[1]}</p></div>
  <div class="card"><h3>By skill</h3>`+Object.entries(by).map(([k,v])=>`<div class="skill"><span class="nm">${esc(SKILLS[k].name)}</span><span class="mono">${v.c}/${v.t}</span><span class="tag ${STATUS[status(k)][1]}">${STATUS[status(k)][0]}</span></div>`).join('')+`</div>`;
  if(e.traps.length){const c={};e.traps.forEach(t=>c[t]=(c[t]||0)+1);h+=`<div class="card"><h3>Watch out for</h3><ul>${Object.entries(c).map(([t,n])=>`<li>${esc(t)}${n>1?` (${n}×)`:''}</li>`).join('')}</ul></div>`;}
  if(run.test){const miss=run.results.filter(x=>!x.correct);
    if(miss.length)h+=`<h2>Review what you missed</h2>`+miss.map(x=>{const q=x.q;const ansStr=q.kind==='mc'?q.options.find(o=>o.ok).t:q.kind==='num'?fmtAns(q):P(...q.ans);
      return `<div class="card"><span class="tag">${esc(SKILLS[q.skill].name)}</span><div class="prompt">${q.prompt}</div>${q.svg?`<div class="diagram">${q.svg}</div>`:''}<div class="fb bad">Your answer: <b>${x.given}</b>. Correct: <b>${ansStr}</b>.${x.trapMsg?' '+x.trapMsg:''}${q.steps?stepsHTML(q):''}${videoLinks(q.skill)}</div></div>`;}).join('');
    else h+=`<div class="card"><b>Perfect score! 🎉</b> You’re ready for the retake.</div>`;}
  h+=teacherCard();
  h+=`<div class="row"><button class="btn orange" onclick="quit()">Done</button>${run.mode==='session'?`<button class="btn ghost" onclick="startSession('${run.sess.id}')">Try again</button>`:''}</div>`;
  return h;
}



/* ---------- Khan Academy videos (shown when stuck) ---------- */
const KA='https://www.khanacademy.org';
const V={
 euclid:['Euclid as the father of geometry',KA+'/math/geometry/hs-geo-transformations/hs-geo-intro-euclid/v/euclid-as-the-father-of-geometry'],
 terms:['Terms & labels in geometry',KA+'/math/geometry/hs-geo-transformations/hs-geo-intro-euclid/v/language-and-notation-of-basic-geometry'],
 lines:['Lines, line segments & rays',KA+'/math/cc-fourth-grade-math/plane-figures/imp-lines-line-segments-and-rays/v/lines-line-segments-and-rays'],
 rays:['Identifying rays',KA+'/math/geometry-home/geometry-lines/geometry-lines-rays/v/identifying-rays'],
 planes:['Specifying planes in three dimensions',KA+'/math/geometry-home/geometry-lines/points-lines-planes/v/specifying-planes-in-three-dimensions'],
 measure:['Measuring line segments',KA+'/math/geometry-home/geometry-lines/basic-geo-measuring-segments/v/measuring-segments'],
 distPy:['Finding distance with the Pythagorean theorem',KA+'/math/8th-engage-ny/engage-8th-module-7/8th-module-7-topic-c/v/example-finding-distance-with-pythagorean-theorem'],
 dist:['Distance formula',KA+'/math/geometry/hs-geo-analytic-geometry/hs-geo-distance-and-midpoints/v/distance-formula'],
 divide:['Dividing line segments',KA+'/math/geometry-home/analytic-geometry-topic/cc-distances-between-points/v/ratios-of-distances-between-colinear-points'],
 mid:['Midpoint formula (and finding a missing endpoint)',KA+'/math/geometry/hs-geo-analytic-geometry/hs-geo-distance-and-midpoints/v/midpoint-formula'],
 angAdd:['Angle addition practice (with video)','https://en.khanacademy.org/math/algebra-basics/alg-basics-equations-and-geometry/equations-geometry/e/angle_addition_postulate'],
 compSupp:['Complementary & supplementary angles',KA+'/tag/complementary-and-supplementary-angles'],
 compAlg:['Equation practice with complementary angles',KA+'/math/geometry/hs-geo-foundations/hs-geo-angles/v/example-using-algebra-to-find-measure-of-complementary-angles'],
 suppAlg:['Equation practice with supplementary angles',KA+'/math/engageny-geo/geo-1/geo-1b-point/v/example-using-algebra-to-find-measure-of-supplementary-angles'],
 vert:['Vertical angles',KA+'/math/geometry/hs-geo-foundations/hs-geo-angles/v/angles-at-the-intersection-of-two-lines']
};
const SKILL_VIDEOS={s14c:['distPy','dist'],s11a:['terms','euclid'],s11b:['euclid'],s12a:['lines','rays'],s12b:['planes'],s13a:['measure'],s13b:['measure'],s14a:['measure'],s14b:['distPy','dist'],s15:['divide'],s16:['divide'],s17a:['mid'],s17b:['mid'],s17c:['mid'],a1:['angAdd'],a4:['angAdd'],a2:['compSupp','compAlg','suppAlg'],a3:['vert','suppAlg']};
function videoLinks(skill){
  const ks=SKILL_VIDEOS[skill];
  if(ks) return `<div class="vids">▶️ <b>Watch:</b> `+ks.map(k=>`<a href="${V[k][1]}" target="_blank" rel="noopener">${esc(V[k][0])}</a>`).join(' · ')+`</div>`;
  const L=LESSONS[SKILLS[skill].lesson];
  return `<div class="vids">▶️ <a href="https://www.khanacademy.org/search?page_search_query=${encodeURIComponent(L.video)}" target="_blank" rel="noopener">Find a Khan Academy video on this</a></div>`;
}

/* ---------- share with teacher ---------- */
function plain(html){const d=document.createElement('div');d.innerHTML=String(html).replace(/<br\s*\/?>/g,' ');return d.textContent.replace(/\s+/g,' ').trim();}
function ansOf(q){return q.kind==='multi'?q.fields.map(f=>f.tol>.04?'≈ '+f.ans.toFixed(1):fmtN(f.ans)).join(', '):q.kind==='mc'?q.options.find(o=>o.ok).t:q.kind==='num'?fmtAns(q):P(...q.ans);}
function teacherCard(){
  return `<div class="card hero" style="border-color:var(--accent)"><h3>📤 Show your teacher</h3>
  <p class="small" style="margin:4px 0 10px">Copy your results into a Google Doc and share it with your teacher, or bring it to extra help. It lists every problem you missed with the worked steps.</p>
  <label class="small muted" for="tq">What do you still not understand? Write your question for your teacher (optional):</label>
  <textarea id="tq" style="min-height:70px;margin-top:6px" placeholder="Example: I don’t get why you subtract in the distance formula when the numbers are negative."></textarea>
  <div class="row" style="margin-top:10px"><button class="btn orange" onclick="copyTeacher()">Copy for my teacher</button><a class="btn ghost" href="https://docs.new" target="_blank" rel="noopener" style="text-decoration:none">Open a new Google Doc ↗</a></div>
  <ol class="small muted" style="margin:10px 0 0;padding-left:20px"><li>Click <b>Copy for my teacher</b>.</li><li>Open a new Google Doc and paste: <b>Ctrl + V</b> on a computer, or tap and hold → <b>Paste</b> on an iPad.</li><li>Click <b>Share</b> and add your teacher, or attach the Doc in Google Classroom.</li></ol></div>`;
}
function teacherReport(question){
  const e=run.entry,r=run.results,missed=r.filter(x=>!x.clean);
  const by={};r.forEach(x=>{by[x.skill]=by[x.skill]||{c:0,t:0};by[x.skill].t++;if(x.clean)by[x.skill].c++;});
  const T=[],H=[];
  const add=(t,h)=>{T.push(t);H.push(h??`<p>${esc(t)}</p>`);};
  const who=state.name?state.name+'’s':'My';add(`${who} Geometry practice: ${e.title}`,`<h2>${esc(who)} Geometry practice: ${esc(e.title)}</h2>`);
  add(`${niceDate(e.date)} · ${e.clean}/${e.total} correct on the first try (${e.pct}%)${run.test?' · practice test, no hints':''}`);
  if(question&&question.trim()){add('My question:',`<h3>My question</h3>`);add(question.trim(),`<p><b>${esc(question.trim())}</b></p>`);}
  add('Results by skill:',`<h3>Results by skill</h3>`);
  Object.entries(by).forEach(([k,v])=>add(`- ${SKILLS[k].name}: ${v.c}/${v.t}`,`<p>• ${esc(SKILLS[k].name)}: ${v.c}/${v.t}</p>`));
  if(missed.length){add('Problems I missed or needed help on:',`<h3>Problems I missed or needed help on</h3>`);
    missed.forEach((x,i)=>{const q=x.q;if(!q)return;const pr=plain(q.prompt)+(q.svg?' (has a diagram)':'');
      add(`${i+1}. ${pr}`,`<p><b>${i+1}. ${esc(pr)}</b></p>`);
      add(`   My answer: ${plain(x.given)}${x.correct?' (correct after '+(x.hint?'a hint':'a second try')+')':''}  |  Correct answer: ${plain(ansOf(q))}`,`<p>My answer: ${esc(plain(x.given))}${x.correct?' (correct after '+(x.hint?'a hint':'a second try')+')':''} · Correct answer: <b>${esc(plain(ansOf(q)))}</b></p>`);
      if(x.trapMsg)add(`   What went wrong: ${plain(x.trapMsg)}`,`<p><i>What went wrong:</i> ${esc(plain(x.trapMsg))}</p>`);
      if(q.steps)add('   Steps: '+q.steps.map(plain).join('  →  '),`<p><i>Steps:</i> ${q.steps.map(z=>esc(plain(z))).join(' → ')}</p>`);
    });}
  else add('No misses this time!');
  return {text:T.join('\n'),html:H.join('')};
}
function copyTeacher(){
  const q=(document.getElementById('tq')||{}).value||'';const {text,html}=teacherReport(q);
  const done=()=>toast('Copied! Now paste it into a Google Doc.');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('Copy didn’t work. Try again.');}ta.remove();};
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]).then(done).catch(()=>{(navigator.clipboard.writeText?navigator.clipboard.writeText(text):Promise.reject()).then(done).catch(fallback);});
    } else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(fallback);}
    else fallback();
  }catch(e){fallback();}
}

/* ---------- progress ---------- */
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return todayStr(d);}
function stats(){
  const all=Object.values(state.skills);const att=all.reduce((a,s)=>a+s.att,0),cl=all.reduce((a,s)=>a+s.clean,0);
  const ws=weekStart();const wk=state.log.filter(l=>l.date>=ws);
  return {att,pct:att?Math.round(100*cl/att):0,daysWeek:new Set(wk.map(l=>l.date)).size,wkProblems:wk.reduce((a,l)=>a+l.total,0),wkPct:wk.length?Math.round(100*wk.reduce((a,l)=>a+l.clean,0)/Math.max(1,wk.reduce((a,l)=>a+l.total,0))):0,sessDone:SESSIONS.filter(s=>state.sessions[s.id]).length};
}
function topTrap(s){const e=Object.entries(s.traps||{}).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:null;}
function summaryText(){
  const st=stats();const lines=[];
  lines.push(`Geometry Coach: ${state.name?state.name+'’s':'my'} progress (${niceDate(todayStr())})`);
  lines.push(`This week: practiced ${st.daysWeek} day(s), ${st.wkProblems} problems, ${st.wkPct}% right on first try.`);
  lines.push(`Path: ${st.sessDone}/${SESSIONS.length} sessions done.${nextSession()?' Next: '+nextSession().title+'.':''}`);
  const pts=state.log.filter(l=>l.title.startsWith('Practice test'));
  if(pts.length)lines.push(`Module 1 practice tests: ${pts.slice(0,4).reverse().map(l=>`${l.pct}% (${niceDate(l.date)})`).join(' → ')}.`);
  const m=Object.keys(SKILLS).filter(k=>status(k)==='mastered');
  if(m.length)lines.push(`Mastered: ${m.map(k=>SKILLS[k].name).join('; ')}.`);
  const w=Object.keys(SKILLS).filter(k=>['practicing','close'].includes(status(k)));
  if(w.length){lines.push('Still working on:');w.forEach(k=>{const s=state.skills[k],t=topTrap(s);lines.push(`- ${SKILLS[k].name} (${s.clean}/${s.att} first try)${t?`, most common mistake: ${t}`:''}`);});}
  const recent=state.log.slice(0,5);if(recent.length){lines.push('Recent:');recent.forEach(l=>lines.push(`- ${niceDate(l.date)}: ${l.title}, ${l.clean}/${l.total}`));}
  return lines.join('\n');
}
function renderProgress(){
  const st=stats();
  let h=`<h1>Progress</h1><p class="sub">Progress is saved in this browser on this device. Use the same device each time. To check in, press “Copy summary” and text it to Dad.</p>
  <div class="grid"><div class="stat"><b>${st.sessDone}/${SESSIONS.length}</b><span>sessions done</span></div><div class="stat"><b>${st.daysWeek}</b><span>days practiced this week</span></div><div class="stat"><b>${st.att}</b><span>problems solved</span></div><div class="stat"><b>${st.pct}%</b><span>right on first try</span></div></div>
  <h2>Skills</h2><div class="card">`+Object.keys(SKILLS).map(k=>{const s=state.skills[k],stt=STATUS[status(k)];const acc=s&&s.att?Math.round(100*s.clean/s.att):0;const t=s?topTrap(s):null;
    return `<div class="skill"><span class="nm">${esc(SKILLS[k].name)}<small>${s&&s.att?`${s.clean}/${s.att} first try${t?` · most common mistake: ${esc(t)}`:''}`:'Not tried yet'}</small></span><span class="minibar"><span class="bar" style="display:block"><i style="width:${acc}%;background:${acc>=80?'var(--good)':acc>=60?'var(--warn)':'var(--accent)'}"></i></span></span><span class="tag ${stt[1]}">${stt[0]}</span></div>`;}).join('')+`</div>
  <h2>Recent activity</h2><div class="card">${state.log.length?state.log.slice(0,10).map(l=>`<div class="skill"><span class="nm">${esc(l.title)}<small>${niceDate(l.date)}</small></span><span class="mono">${l.clean}/${l.total}</span></div>`).join(''):'<p class="muted" style="margin:0">Nothing yet. Start your first session!</p>'}</div>
  <h2>📲 Send to Dad</h2><div class="card"><p class="small muted" style="margin-top:0">Copy this and text or email it to Dad. You can also paste it into a Google Doc for your teacher. He can paste it into Claude to plan next week around what you’re stuck on.</p>
  <textarea id="sumTxt" readonly>${esc(summaryText())}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="copyText('sumTxt','Summary copied. Paste it into a text to Dad.')">Copy summary</button></div></div>
  <h2>Backup &amp; move</h2><div class="card"><p class="small muted" style="margin-top:0">Switching computers or browsers? Copy your backup code here, then paste it into “Restore” on the new one.</p>
  <textarea id="bk" readonly style="min-height:70px">${esc(btoa(unescape(encodeURIComponent(JSON.stringify(state)))))}</textarea>
  <div class="row" style="margin:10px 0 18px"><button class="btn alt" onclick="copyText('bk','Backup code copied')">Copy backup code</button></div>
  <textarea id="rs" placeholder="Paste a backup code here to restore" style="min-height:70px"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="restore()">Restore</button><span style="flex:1"></span><button class="btn ghost" style="color:var(--bad)" onclick="resetAll()">Reset all progress</button></div><div id="rsMsg"></div></div>`;
  main.innerHTML=h;
}
function copyText(id,msg){const el=document.getElementById(id);const t=el.value;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg)).catch(()=>{el.removeAttribute('readonly');el.focus();el.select();try{document.execCommand('copy');toast(msg);}catch(e){toast('Select the text and press Ctrl/Cmd + C');}el.setAttribute('readonly','');});}
function restore(){const v=document.getElementById('rs').value.trim();try{const s=JSON.parse(decodeURIComponent(escape(atob(v))));if(!s.skills)throw 0;state=Object.assign({skills:{},sessions:{},log:[],days:[],recent:{}},s);save();toast('Progress restored');render();}catch(e){document.getElementById('rsMsg').innerHTML='<div class="fb bad">That code didn’t work. Make sure you copied the whole thing.</div>';}}
let resetArm=false;
function resetAll(){const m=document.getElementById('rsMsg');if(!resetArm){resetArm=true;m.innerHTML='<div class="fb hint">This erases ALL progress. Press “Reset all progress” again to confirm.</div>';setTimeout(()=>resetArm=false,6000);return;}state={skills:{},sessions:{},log:[],days:[],recent:{}};save();resetArm=false;toast('Progress reset');render();}

load();render();
</script>
